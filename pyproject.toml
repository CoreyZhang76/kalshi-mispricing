[project]
name = "kalshi-mispricing"
version = "0.1.0"
description = "Research tool for measuring cross-market pricing inefficiencies on Kalshi. Data collection and analysis only, no order execution."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyarrow>=17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmm"]
